<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Quezon Central Church</title>
    <link rel="icon" type="image/x-icon" href="../logo/qonnect.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
    <div class="admin-login-wrapper">
        <div class="admin-card">
            <h1 class="admin-card-title">Admin Login</h1>
            <p class="admin-card-subtitle">Quezon Central Church content management</p>
            <div id="loginAlert"></div>
            <form class="admin-form" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Log In</button>
            </form>
        </div>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/admin-auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const alertBox = document.getElementById('loginAlert');
            alertBox.innerHTML = '';

            try {
                await AdminAuth.login(email, password);
                window.location.href = 'admin-dashboard.html';
            } catch (error) {
                alertBox.innerHTML = `<div class="admin-alert admin-alert-error">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
