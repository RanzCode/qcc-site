<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <link rel="stylesheet" href="/css/chat-widget.css">
    <style>
      .video-wrapper {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
      }
      .video-container {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
        border-radius: 12px;
        overflow: hidden;
        background-color: #000;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }
      .thumbnail-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://i.ytimg.com/vi/gwY1VAmuZpA/maxresdefault.jpg?sqp=-oaymwEmCIAKENAF8quKqQMa8AEB-AH-CYAC0AWKAgwIABABGGIgZShNMA8=&rs=AOn4CLDqlxqMY75uSk3SSFsybu2x_0THnw');
        background-size: cover;
        background-position: center;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease;
      }
      .thumbnail-overlay:hover {
        opacity: 0.95;
      }
      .play-button {
        width: 68px;
        height: 48px;
        background-color: rgba(0,0,0,0.8);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s ease;
      }
      .play-button::before {
        content: '';
        border-style: solid;
        border-width: 12px 0 12px 20px;
        border-color: transparent transparent transparent white;
      }
      .thumbnail-overlay:hover .play-button {
        background-color: #ff0000;
      }
      /* Hide overlay when clicked */
      .thumbnail-overlay.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="video-wrapper">
      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/gwY1VAmuZpA" 
          title="YouTube video player" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
        <div class="thumbnail-overlay">
          <div class="play-button"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const overlay = document.querySelector('.thumbnail-overlay');
        if (overlay) {
          overlay.addEventListener('click', function() {
            this.classList.add('hidden');
          });
        }
      });
    </script>

    <!-- Chat Widget -->
    <div class="chat-widget" id="chatWidget">
        <button class="chat-toggle" id="chatToggle">
            <i class="fas fa-comments"></i>
        </button>
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <div class="chat-title">
                    <i class="fas fa-church"></i>
                    <span>Church Chat Assistant</span>
                </div>
                <button class="chat-close" id="chatClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be added here dynamically -->
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type your message...">
                <button id="sendMessage">Send</button>
            </div>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Chat Widget Script -->
    <script src="/js/chat-widget.js"></script>
  </body>
</html>
